<!DOCTYPE html>
<html>
<head>
    <title>BMI Calculator</title>
    <style>
    body { 
        /* Adds a nice linear gradient background */
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        display: flex; 
        justify-content: center; 
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }
    .container { 
        background: #ffffff;
        max-width: 400px; 
        width: 90%;
        padding: 30px; 
        border-radius: 16px; 
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    h2 { color: #333; margin-top: 0; }
    
    label { font-weight: 600; color: #444; display: block; margin: 15px 0 5px; }
    
    input { 
        width: 100%; 
        padding: 12px; 
        border: 2px solid #eee; 
        border-radius: 8px; 
        box-sizing: border-box; 
        font-size: 16px;
    }
    
    button { 
        width: 100%; 
        margin-top: 25px; 
        padding: 14px; 
        background-color: #764ba2; 
        color: white; 
        border: none; 
        border-radius: 8px; 
        font-size: 16px; 
        font-weight: bold;
        cursor: pointer; 
        transition: transform 0.2s, background 0.3s;
    }
    
    button:hover { background-color: #5a387d; transform: translateY(-2px); }
    
    .result { 
        margin-top: 25px; 
        padding: 20px; 
        background-color: #f8f9fa; 
        border-left: 5px solid #764ba2;
        border-radius: 4px;
        text-align: center;
    }
    
    .result p { color: #2d3436; font-size: 1.2em; margin: 8px 0; }
    .result a { color: #764ba2; font-weight: bold; text-decoration: none; display: block; margin-top: 15px; }
</style>
</head>
<body>

<div class="container">
    <h2>BMI Calculator</h2>
    <form method="POST">
        <label>Weight in kilograms:</label>
        <input type="number" step="0.1" name="weight" required>
        <label>Height in meters:</label>
        <input type="number" step="0.01" name="height" required>
        <button type="submit">Calculate BMI</button>
    </form>

    {% if error %}
        <div style="color: #d9534f; background: #f9d6d5; padding: 10px; border-radius: 6px; margin-top: 15px; text-align: center; font-weight: bold;">
            {{ error }}
        </div>
    {% endif %}

    {% if bmi %}
    <div class="result">
        <h2>BMI Calculator Result</h2>
        <p style="font-size: 0.9em; color: #666;">
            For weight: {{ weight }} kg and height: {{ height }} m
        </p>
        
        <p><strong>Your BMI is:</strong> {{ bmi }}</p>
        <p><strong>You are classified as:</strong> {{ category }}</p>
        <a href="/">Calculate Again</a>
    </div>
    {% endif %}
</div>

</body>
</html>
